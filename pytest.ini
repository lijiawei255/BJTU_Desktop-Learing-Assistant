[pytest]
testpaths = tests
addopts = --strict-markers -ra
markers =
    api: requires explicit --run-api and a real Alibaba API key
    hardware: requires explicit --run-hardware and real audio/devices
filterwarnings =
    error::pytest.PytestReturnNotNoneWarning
    error::pytest.PytestUnhandledThreadExceptionWarning
    error::pytest.PytestUnraisableExceptionWarning
